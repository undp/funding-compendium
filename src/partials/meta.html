<title>{{this.meta.title}}</title>
<meta name="description" content="{{this.meta.description}}" />
{{#if this.meta.keywords}}
  <meta name="keywords" content="{{this.meta.keywords}}" />
{{/if}}
<link rel="canonical" href="{{this.canonical}}{{@root.canonicalPath}}" />
<meta property="og:type" content="website" />
<meta property="og:title" content="{{this.meta.ogtitle}}" />
<meta property="og:site_name" content="UNDP" />
<meta property="og:url" content="{{this.canonical}}{{@root.canonicalPath}}" />
<meta property="og:description" content="{{this.meta.description}}" />
<meta property="og:image" content="{{this.canonical}}assets/img/{{this.meta.image}}" />
<meta property="og:image:width" content="1920" />
<meta property="og:image:height" content="1080" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:site" content="@undp" />
<meta name="twitter:title" content="{{this.meta.ogtitle}}" />
<meta name="twitter:description" content="{{this.meta.description}}" />
<meta name="twitter:image" content="{{this.canonical}}assets/img/{{this.meta.image}}" />
<link rel="alternate" hreflang="en" href="{{@root.root}}" />
<link rel="alternate" hreflang="fr" href="{{@root.root}}fr/" />
<link rel="alternate" hreflang="es" href="{{@root.root}}es/" />


<link rel="icon" href="{{@root.root}}favicon.ico" type="image/x-icon">
<link rel="shortcut icon" href="{{@root.root}}favicon.ico" type="image/x-icon">


{{#each @root.ds}}
  <link rel="preload" href="{{../cdn}}css/{{this}}" as="style" onload="this.onload=null;this.rel='stylesheet'">
{{/each}}



<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@undp/design-system-assets/css/components/download-modal.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@undp/design-system-assets/css/components/download-row.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.3.2/css/flag-icons.min.css">
<link rel="stylesheet" href="{{@root.root}}assets/css/app.css">


{{#if this.gtm}}<!-- Google Tag Manager -->
  <script>(function (w, d, s, l, i) {
      w[l] = w[l] || []; w[l].push({
        'gtm.start':
          new Date().getTime(), event: 'gtm.js'
      }); var f = d.getElementsByTagName(s)[0],
        j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : ''; j.async = true; j.src =
          'https://www.googletagmanager.com/gtm.js?id=' + i + dl; f.parentNode.insertBefore(j, f);
