          - { rank: 32, contributor: Samoa, flag: ws, usd: '$6,000' }
  # Government contributions to local office costs
  gloc:
    heading: Government contributions to local office costs
    copy: Annual government contributions to local office costs (GLOC) are an important source of revenue and take the form of cash or in-kind contributions from host governments. In low- and middle-income countries, $39 million was received in 2025 (up from $29 million in 2024), consisting of $31 million in cash contributions and $8 million of in-kind contributions for premises and utilities.

