      footnote: In 2019, UNDP refined its accounting policy on IPSAS 23 (non-exchange) revenues. Under this policy, UNDP records the full value of funding agreements when they are signed, even when cash has not been received for the majority of contribution agreements. Any uncollected cash associated with funding agreements is held as a receivable. Under UNDP financial regulations and rules, UNDP is permitted to spend only up to the amount of cash received. In this document, where applicable, “annual contributions” are therefore aligned with past revenue recognition policies for contributions (i.e., cash received in a reporting year, plus receivables due in a reporting year).
