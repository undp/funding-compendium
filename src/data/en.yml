un-system-support:
  unds:
    heading: Support to United Nations system programmes, offices and initiatives
    copy:
      para1: In 2025, UNDP continued to serve as the institutional platform for four UN entities, delivering critical services across the UN system.
      para2: "<strong>Support to United Nations organizations: </strong> UNDP continued to be the operational backbone of the UN system in 2025. It disbursed $2.3 billion in 109 currencies through its payroll system, 54 percent of which was on behalf of partner UN organizations. UNDP supported $3.2 billion in financial transactions for 70 UN entities and other agencies in 170 countries. In addition, UNDP provided common premises for other agencies in 130 countries, enabling them to access common services, including travel management. \n"
    unv:
      logo: unv.png
      alt: UN Volunteers logo
      title: United Nations Volunteers
      copy: The <strong>UN Volunteers programme</strong> promotes volunteerism to support peace and development worldwide. During 2025, 17,169 UN Volunteers from 182 countries supported 59 partner UN entities in their peace and development activities in 172 countries.
    uncdf:
      logo: uncdf.png
      alt: UNCDF logo
      title: UN Capital Development Fund
      copy: In 2025, the <strong>UN Capital Development Fund</strong> provided $6 million in loans and $3.1 million in guarantees, leveraging and catalysing a total of $50 million in financing to support development solutions in 19 countries. Through UNCDF-enabled solutions, 3.3 million people were reached, of whom two-thirds were women.
    mptf:
      logo: mptf.png
      alt: Multi-Partner Trust Fund Office logo
      title: 'Multi-Partner Trust Fund Office '
      copy: The <strong>Multi-Partner Trust Fund Office</strong> transferred $1.06 billion to participating UN and non-UN entities in 2025, supporting development, climate and environment, and peace and transition outcomes for sustainable development progress. As a system-wide UN asset, the MPTF disbursed over $860 million to 41 UN entities and 111 countries in 2025.
    unossc:
      logo: unossc.png
      alt: UNOSSC logo
      title: 'UN Office for South–South Cooperation '
      copy: In 2025, the <strong>UN Office for South–South Cooperation</strong> supported 41 UN resolutions and decisions that incorporated South–South and triangular cooperation modalities. It also facilitated the implementation of South–South and triangular cooperation trust fund projects across 50 developing countries.

