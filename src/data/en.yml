other-resources-page:
  hero:
    overline: UNDP Funding Compendium 2025
    title: Other resources and partnerships
  overview:
    copy1: Other resources are earmarked contributions that supplement regular, or core, resources. They range from softly earmarked thematic funds to tightly earmarked funds for specific programmes or projects. Other resources are channelled to UNDP through government financing, thematic funding windows, UN pooled funds, vertical funds or third-party cost-sharing.
    copy2: In 2025, annual contributions to other resources increased to $4.6 billion, up by 6 percent from $4.3 billion in 2024.
    contributors-chart: Top 20 other resources contributors, 2025
    recipients-chart: Top 15 recipient countries of other resources, 2025
  thematic:
    heading: Thematic funds
    copy: The funding windows remain UNDP’s principal flexible funding instrument after regular resources, providing critical support for integrated programming. In 2025, contributions to the funding windows declined to $115 million from $133 million in 2024. UNDP is grateful for the continued support of our partners for the funding windows.
    chart: Funding window contributions, 2022–2025
  pooled:
    heading: UN pooled funds
    copy1: A UN inter-agency pooled fund is a financing mechanism that supports a clearly defined programmatic purpose and results framework through contributions from more than one contributor. These funds enable global, regional and country-level responses to humanitarian, development, peace and transition and climate and environment-related challenges.
    copy2: In 2025, UNDP remained the largest participating organization in inter-agency pooled funds, receiving $234 million, down by 7 percent from $251 million in 2024.
    top-funds-chart: Top 15 UN pooled funds received by UNDP as a participating UN organization, 2025
    member-states-chart: Top 15 Member State contributions
    trend-chart: UN pooled funding to UNDP, 2022–2025
  government:
    heading: Government development financing
    intro: Government development financing is a voluntary funding mechanism through which programme country governments entrust their domestic resources, or loans extended by international financial institutions (IFIs), to UNDP to assist in implementing development initiatives in their respective countries.
    total: $1.4B
    total-copy: Total government financing in 2025, representing 28 percent of total resources and a 17 percent increase from 2024.
    loans: $113M
    loans-copy: Financed through loans from international financial institutions.
    country-chart: Government financing by country, 2024
    region-heading: Government financing by region
    region-copy: In 2025, programme countries in Latin America and the Caribbean contributed 62 percent of total government financing, followed by Africa (17 percent), Europe and the Commonwealth of Independent States (9 percent), the Arab States (8 percent), and Asia and the Pacific (4 percent).
    region-chart: Contributions to government financing, 2022–2025
  vertical:
    heading: Vertical funds
    copy1: Vertical funds are earmarked for a single area of development such as nature, climate, energy or health. These funds are governed by steering committees and are not directly administered by UNDP.
    copy2: In 2025, UNDP received $825 million from vertical funds, an 11 percent decrease from the $920 million received in 2024. The largest contributions came from the Global Environment Facility ($372 million), the Global Fund ($311 million) and the Green Climate Fund ($84 million).
    chart: Vertical fund contributions, 2024–2025
  cost-sharing:
    heading: Third-party cost-sharing
    intro: Earmarked contributions for a specific programme or project continue to make up the largest share of UNDP resources. In 2025, these contributions amounted to $1.95 billion (39 percent of total resources).
    eu-heading: Partnering with the European Union
    eu-copy: As UNDP’s third-largest donor in 2025, the European Union remains a strong partner. It contributed $313 million for UNDP programmes in Türkiye, Lebanon, Nigeria, Cyprus, Bosnia and Herzegovina, the Philippines and other countries, a 3 percent increase from the $305 million received in 2024.
    eu-chart: Contributions from the European Union, 2022–2025
  institutions:
    heading: Partnering with financing institutions
    copy1: UNDP’s financial and non-financial partnerships with IFIs are central to promoting $1 trillion in public expenditure and private capital investments aligned with the SDGs.
    copy2: In 2025, UNDP received $316 million from IFIs, an 8 percent decrease from $344 million in 2024. Top IFI contributors were Kreditanstalt für Wiederaufbau (KfW), at $105 million, and the World Bank, at $88 million. This funding comprised $203 million in direct grants and $113 million in indirect government contributions.
    total-chart: Total contributions by IFI, 2025
    type-chart: IFI contributions by type, 2022–2025
    recipients-chart: Top 10 recipients of IFI funding, 2025
  private-sector:
    heading: Partnering with private companies, foundations, NGOs and academic institutions
    copy1: Contributions from the private sector, foundations, non-governmental organizations and academic, training and research institutions decreased to $89 million in 2025, down by 5 percent from $94 million in 2024.
    copy2: Partnerships with the private sector accelerate progress towards the SDGs by mobilizing capital, innovation and technology. Through its Finance Moonshot, UNDP leveraged $920 billion in public and private finance for the SDGs, helping countries mobilize investment for development priorities. Through the timbuktoo initiative, a flagship partnership to mobilize capital for innovation across Africa, UNDP is working to raise $1 billion over the next decade to support 10,000 start-ups and scale 1,000 ventures to generate $10 billion and positively impact 100 million lives.
    contributors-chart: Top 10 contributors, 2025
    trend-chart: Annual contributions, 2022–2025
