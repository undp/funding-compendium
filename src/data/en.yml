  # Transparency and accountability
  transparency:
    aria-label: Transparency commitments
    longstanding:
      heading: A long-standing commitment to transparency
      copy: |-
        <p>As a member of the International Aid Transparency Initiative (IATI) since its creation in 2008, UNDP has led outreach efforts with partner countries and UN agencies to champion the aid transparency standard and make it relevant to national development planning, public financial management and mutual accountability for aid, development and humanitarian funding. UNDP ranked <strong>sixth overall</strong> in the <a href="https://www.publishwhatyoufund.org/the-index/2024/" target="_blank" rel="noopener noreferrer">2024 Aid Transparency Index</a> and was the <strong>second-most-transparent UN agency</strong>.</p>
        <br>
        <p>UNDP’s <a href="https://open.undp.org/" target="_blank">Transparency Portal</a> allows open, comprehensive public access to data on over 4,000 UNDP projects, with links to profile pages for every donor. The portal also shows UNDP’s contribution to the SDGs and offers an online training platform on the IATI Standard.</p>
    un-system:
      heading: Promoting transparency across the UN system
      copy: 'UNDP actively participated in defining and implementing a set of <a href="https://unsdg.un.org/sites/default/files/2022-04/UN_DataStandards_Digital_March2022.pdf" target="_blank">UN data standards</a> for system-wide financial reporting.'
    audit:
      heading: Audit reports
      copy: 'UNDP has been <a href="https://www.undp.org/content/undp/en/home/accountability/audit/disclosure-of-internal-audit-reports.html" target="_blank">publishing audit reports</a> issued by the Office of Audit and Investigations since 2012, and has obtained its 20th consecutive unqualified (clean) audit from the UN Board of Auditors.'
  # Resources by funding type
  funding-type:
    heading: Resources by funding type
    subheading: Regular and other resources, 2025
    summary: |-
      <p><strong>Annual contributions increased to $5 billion in 2025,</strong> up by 2 percent from $4.9 billion in 2024.</p>
      <p><strong style="color: #637300;">Annual contributions to regular resources decreased to $442 million,</strong> down by 24 percent from $581 million in 2024.</p>
      <p><strong style="color: #0069B3;">Annual contributions to other resources increased to $4.6 billion,</strong> up by 6 percent from $4.3 billion in 2024.</p>
    core-copy: Regular resources are critical to UNDP’s ability to prioritize countries’ needs, respond swiftly in crises and maintain high standards of accountability and transparency. They also allow UNDP to sustain country presence and upstream policy expertise that other types of funding cannot support. Regular resources also carry strong catalytic value, mobilizing additional other resources (non-core). Insufficient regular resources would therefore severely compromise UNDP’s unique ability to respond rapidly to emergencies and address critical needs that other funding sources do not cover. The decline in regular resources also has serious implications for UNDP’s ability to deliver the intended results of the Strategic Plan, restore and accelerate progress towards the Sustainable Development Goals (SDGs) and maintain robust oversight and accountability systems.
    trends-heading: Trends in regular and other resources, 2022–2025
    trends-copy: UNDP maintained broadly stable annual contributions throughout the period covered by the 2022–2025 Strategic Plan, averaging approximately $4.9 billion per year. Annual contributions reached a peak of $5.0 billion in both 2023 and 2025.
  # Resources by funding partner
  funding-partner:
    heading: Resources by funding partner
    subheading: Regular and other resources, 2025
    copy: UNDP values all types of funding received from its partners—including Member States, multilateral organizations, non-governmental organizations, private and philanthropic organizations and financing institutions—as these resources enable it to deliver on its commitments. In 2025, UNDP received total annual contributions of $5 billion. Of this total, 36 percent was contributed by donor country governments, 32 percent by multilateral organizations, and 32 percent by programme country governments.
    top-heading: Top 30 resource partners, 2025
    top-copy: In 2025, UNDP’s top 30 resource partners contributed $4.1 billion, or 82 percent of total annual contributions. These partners provided 89 percent of regular resources and 81 percent of other resource contributions.
  # Resources by funding channel
  funding-channel:
    heading: Resources by funding channel
    copy: In 2025, UNDP benefited from increases in government development financing (17 percent) and third-party cost-sharing (7 percent).
    case-heading: UNDP Funding Types and Channels
    types-heading: The case for regular (core) resources in 2025
    types:
      regular:
        heading: Regular (core) resources
        copy: Unearmarked funds that provide a flexible foundation for delivering results across the Strategic Plan.
      other:
        heading: Other resources
        copy: 'Earmarked funds that support specific themes, programmes or projects.<br>These include:'
      government:
        heading: Government financing
        copy: Voluntary funding through which programme country governments entrust domestic resources or loans from financial institutions to UNDP to support development initiatives in their respective countries.
      thematic:
        heading: Thematic funds
        copy: Softly earmarked pooled funds that support the achievement of outcomes aligned with the Strategic Plan and address issues that cut across thematic areas.
      cost-sharing:
        heading: Third-party cost-sharing
        copy: Earmarked contributions for a specific programme, project, region, or country.
      pooled:
        heading: UN pooled funds
        copy: UN inter-agency financing mechanisms that support clearly defined programmatic scopes and results frameworks, enabling global and local responses to humanitarian, development, environmental and peace-related challenges.
      vertical:
        heading: Vertical funds
        copy: Earmarked funds focused on a single area of development, such as health or the environment.
      reimbursable:
        heading: Reimbursable support services
        copy: Funds received for management and support services, including services provided by UN Volunteers and the Junior Professional Officer (JPO) Programme.

