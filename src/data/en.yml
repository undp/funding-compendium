  foreword:
    overline: Foreword
    headline: Investing in a stable and sustainable future
    subhead:
    copy-part1: "<p>For 60 years, countries and communities have actively sought out the United Nations Development Programme’s (UNDP) support to turn ambition into reality, risk into resilience, build prosperity, protect the planet, and prevent crises.</p> <p>This Funding Compendium provides an overview of the financing UNDP uses to do that work. It also demonstrates the remarkable returns donors achieve on their investments and highlights where additional support can multiply that impact.</p> <p>When we strengthen democratic institutions, we reduce the likelihood of political upheaval. When we support economic opportunities in fragile communities, we reduce the lure of extremism. Our climate disaster preparedness prevents humanitarian catastrophes that could potentially displace millions of people. Restoring basic services after conflict creates conditions for lasting peace rather than renewed violence. In essence, UNDP helps to ‘de-risk’ the world’s political, social, and financial operating environment.</p>\n"
    copy-part2: |
      <p>As part of the United Nations family and with our partners, UNDP continues to deliver measurable results where they matter most. We have enabled over 800 million registered voters to participate in 57 elections across 43 countries since 2022, protecting democracy at a time when it is under siege globally. In the same period, we have supported governments to reach more than 100 million people with essential services like electricity and water, and helped over 19 million displaced people regain livelihoods and access justice. More than half of the UNDP’s total annual budget is allocated to fragile and crisis settings as we stay and deliver in some of the world’s most challenging contexts: Afghanistan, Gaza, Haiti, Myanmar, Sudan, Ukraine, when others cannot.</p>
      <p>It proves how development cooperation works, delivering extraordinary results over the past six decades. Extreme poverty rates are at historic lows, life expectancy is at record highs, and nearly 70 percent of people are now connected online. These achievements represent not just major leaps forward in human development, but the kind of structural stability that prevents local problems from escalating into global crises.</p>
      <p>Drawing on six decades of experience, UNDP’s next Strategic Plan 2026-29 focuses on four objectives: prosperity for all, effective governance, crisis resilience, and planetary health. The objectives will be accelerated by digital and AI transformation, gender equality, and sustainable finance.</p>
      <p>At a time when cuts in Official Development Assistance (ODA) are undermining our collective ability to respond, UNDP is delivering exceptional value. We transformed $581 million in core funding and fuelled $4.8 billion in life-changing development outcomes in 2024.</p>
      <p>For every $1 of core funding, UNDP has unlocked $7 in additional resources for countries and catalysed nearly $60 in public and private investments in the Sustainable Development Goals (SDGs), including key areas like tackling poverty, enhancing climate action, and advancing gender equality. But we face unprecedented challenges: rising inequality, record levels of conflict, accelerating climate impacts, and mounting economic pressures. These interconnected crises will cost far more to fix later than to prevent now.</p>
      <p>We are grateful to our partners who sustained their investment in UNDP throughout 2024, particularly the 10 core contributors who increased their support during this challenging period and those who make multi-year commitments, which give us the certainty for planning.</p>
      <p>Additional investment will give much more in terms of the outcomes needed. We ask our partners to continue - and increase - their investment in UNDP. Without UNDP’s continued presence and resources, the stability we have helped build over six decades will be at serious risk. The world’s most vulnerable people and places depend on our collective resolve.</p>
    photo-credit: 'Photo: Fouad Juez

'
    name: Susan Brown
    position-title: 'Assistant Secretary-General and Assistant Administrator <br> Bureau of External Relations and Advocacy <br> United Nations Development Programme

'
  exec-summary:
    headline: Executive Summary
    copy: "<p>The Funding Compendium presents the annual contributions received by UNDP from its funding partners through various channels. These include regular (core) resources and other resources and range from softly earmarked thematic funds to tightly earmarked funds for specific programmes or projects.</p> <p>The year 2025 tested UNDP’s agility, resilience and ability to respond to complexity. During the global decline in official development assistance (ODA) in 2025, UNDP’s annual contributions from its partners remained broadly stable at $5 billion, a 2 percent increase compared to 2024. However, despite this overall stability, the quality of funding continued to deteriorate. In 2025, regular resources declined to $442 million, down by 24 percent from $581 million in 2024.</p> <p>Despite the record-low level of regular resources received in 2025, UNDP delivered $4.9 billion in programme expenditure, allocated 91 cents of every programmatic dollar to development activities and continued to demonstrate the catalytic value of regular resources by mobilizing approximately $10 in other resources for every $1 of core funding.</p> <p>The declining trend in regular resources increasingly constrains UNDP’s ability to adequately support country programming, respond to crises, invest in innovation and maintain the institutional capabilities that underpin integrated development solutions.</p>\n"
  transparency:
    headline: Commitment to transparency and accountability
  action:
    swiper:
      flexible-foundation:
        title: Flexible foundation for impact
        body: Core funding provides UNDP with flexible, predictable resources that enable it to respond rapidly to emerging challenges while maintaining a focus on long-term development goals in 170 countries and territories.
      reaching-most-in-need:
        title: Reaching those most in need
        body: '"The lion''s share of the core programme budget is channelled through country programmes. In 2022–2025, over 80 percent of these resources (TRAC-1, TRAC-2 and TRAC-3) were allocated to least developed countries, and over 70 percent to low-income countries, prioritizing the "last mile"—the poorest and most excluded populations."

'
      multiplier-effect:
        title: Multiplier effect
        body: Core funding acts as a catalyst for additional investment. A programme established with core resources as seed funding can subsequently scale up by mobilizing other resources. In 2025, $1 of regular resources mobilized an additional $10 in other resources. In Gaza, core funding enabled UNDP to remove 225,000 tonnes of debris for 1.3 million people.
      crisis-readiness:
        title: Crisis readiness and response
        body: UNDP spends 52 percent of its resources in fragile contexts, investing in all 61 countries defined as fragile by the OECD. Core resources enable early warning analysis, crisis prevention advocacy and immediate responses to conflicts and disasters. In Ukraine, UNDP's core-funded presence supported the assessment of 94,000 km² of potentially mine-contaminated land, including over 36,000 km² of agricultural land, while expanding access to digital public services for 466,101 internally displaced people and strengthening both recovery and resilience.
      pioneering-innovation:
        title: Pioneering innovative approaches to development
        body: Core funding enables UNDP to push the boundaries on frontier development issues. For example, it supports the Accelerator Labs Network, which has identified over 6,000 grass-roots solutions to development challenges across 115 countries. It also sustains the Human Development Report Office, which spearheads cutting-edge research, promotes new ideas and advocates for practical policy changes.
      governance-electoral:
        title: Governance and electoral support
        body: From 2022–2025, UNDP supported processes involving 911.3 million registered voters across 78 elections in 51 countries. In the Philippines, for example, core funding enabled UNDP to support the uptake of digital tools to increase transparency in campaign financing and strengthen voter education, reaching 2,260 voters, including youth, women, Indigenous communities and traditional leaders.
      digital-transformation:
        title: Digital transformation
        body: With core resources, UNDP helps countries harness digital technologies to improve governance, service delivery and inclusion. In 2025, UNDP supported digital transformation in over 130 countries, enabling 49 million people to benefit from digital services and technologies while helping governments strengthen digital public infrastructure and innovative solutions for sustainable development.
      climate-action:
        title: Climate action at scale
        body: As the largest UN provider of climate assistance, UNDP helps nations strengthen their environmental commitments, secure vital financing and implement equitable energy transitions. Initially launched with core resources, UNDP's Climate Promise has grown to support 90 percent of developing countries in designing and implementing ambitious Nationally Determined Contributions.
      operational-excellence:
        title: Operational excellence
        body: Core funding maintains UNDP's global infrastructure and quality standards, supporting independent oversight functions, including evaluation, ethics and development effectiveness. In 2024, UNDP received its 19th consecutive clean audit from the UN Board of Auditors, having stewarded over $100 billion in total revenue over 20 years while maintaining the highest standards of accountability and transparency.
      efficiency-un-system:
        title: Efficiency across the UN system
        body: Core resources also drive greater efficiency and improve coordination across the entire UN system. UNDP is the single largest contributor to the UN Resident Coordinator System. It delivers dependable services to over 70 UN entities and manages 136 UN common premises globally, providing common services at the country level.
      trust-transformation:
        title: Trust and transformation
        body: By investing in core funding, partners support a model that promotes national agency, reduces dependency and creates lasting, transformative change.
un-system-support:
  unds:
    heading: Support to United Nations system programmes, offices and initiatives
    copy:
      para1: 'In 2025, UNDP continued to serve as the institutional platform for four UN entities, delivering critical services across the UN system.

'
      para2: "<strong>Support to United Nations organizations: </strong> UNDP continued to be the operational backbone of the UN system in 2025. It disbursed $2.3 billion in 109 currencies through its payroll system, 54 percent of which was on behalf of partner UN organizations. UNDP supported $3.2 billion in financial transactions for 70 UN entities and other agencies in 170 countries. In addition, UNDP provided common premises for other agencies in 130 countries, enabling them to access common services, including travel management. \n"
    unv:
      logo: unv.png
      alt: UN Volunteers logo
      title: United Nations Volunteers
      copy: The UN Volunteers programme promotes volunteerism to support peace and development worldwide. During 2025, 17,169 UN Volunteers from 182 countries supported 59 partner UN entities in their peace and development activities in 172 countries.
    uncdf:
      logo: uncdf.png
      alt: UNCDF logo
      title: UN Capital Development Fund
      copy: In 2025, the UN Capital Development Fund provided $6 million in loans and $3.1 million in guarantees, leveraging and catalysing a total of $50 million in financing to support development solutions in 19 countries. Through UNCDF-enabled solutions, 3.3 million people were reached, of whom two-thirds were women.
    mptf:
      logo: mptf.png
      alt: Multi-Partner Trust Fund Office logo
      title: 'Multi-Partner Trust Fund Office '
      copy: The Multi-Partner Trust Fund Office transferred $1.06 billion to participating UN and non-UN entities in 2025, supporting development, climate and environment, and peace and transition outcomes for sustainable development progress. As a system-wide UN asset, the MPTF disbursed over $860 million to 41 UN entities and 111 countries in 2025.
    unossc:
      logo: unossc.png
      alt: UNOSSC logo
      title: 'UN Office for South–South Cooperation '
      copy: In 2025, the UN Office for South–South Cooperation supported 41 UN resolutions and decisions that incorporated South–South and triangular cooperation modalities. It also facilitated the implementation of South–South and triangular cooperation trust fund projects across 50 developing countries.

landscape-page:
  hero:
    overline: UNDP Funding Compendium 2025
    title: Funding landscape
  transparency:
    longstanding:
      heading: A long-standing commitment to transparency
      copy: |-
        <p>As a member of the International Aid Transparency Initiative (IATI) since its creation in 2008, UNDP has led outreach efforts with partner countries and UN agencies to champion the aid transparency standard and make it relevant for national development planning, public financial management and mutual accountability of aid, development and humanitarian funding. UNDP ranked <strong>sixth overall</strong> in the <a href="https://www.publishwhatyoufund.org/the-index/2024/" target="_blank">2024 Aid Transparency Index</a> and was the <strong>second most transparent UN agency</strong>.</p>
        <p>UNDP’s <a href="https://open.undp.org/" target="_blank">Transparency Portal</a> allows open, comprehensive public access to data on over 4,000 UNDP projects, with links to profile pages for every donor. The portal also shows UNDP’s contribution to the SDGs and offers an online training platform on the IATI Standard.</p>
    un-system:
      heading: Promoting transparency across the UN system
      copy: 'UNDP actively participated in defining and implementing a set of <a href="https://unsdg.un.org/sites/default/files/2022-04/UN_DataStandards_Digital_March2022.pdf" target="_blank">UN data standards</a> for system-wide financial reporting.'
    audit:
      heading: Audit reports
      copy: 'UNDP has been <a href="https://www.undp.org/content/undp/en/home/accountability/audit/disclosure-of-internal-audit-reports.html" target="_blank">publishing audit reports</a> issued by the Office of Audit and Investigations since 2012, and has obtained its 19th consecutive unqualified (clean) audit from the UN Board of Auditors.'
  funding-type:
    heading: Resources by funding type
    subheading: Regular and other resources, 2025
    summary: |-
      <p><strong>Annual contributions increased to $5 billion in 2025,</strong> up by 2 percent from $4.9 billion in 2024.</p>
      <p><strong style="color: #C3D51F;">Annual contributions to regular resources decreased to $442 million,</strong> down by 24 percent from $581 million in 2024.</p>
      <p><strong style="color: #0069B3;">Annual contributions to other resources increased to $4.6 billion,</strong> up by 6 percent from $4.3 billion in 2024.</p>
    core-copy: Regular resources are critical to UNDP's ability to prioritize countries' needs, respond swiftly in crises and maintain high standards of accountability and transparency. They also allow UNDP to sustain country presence and upstream policy expertise that other types of funding cannot support. Regular resources also carry strong catalytic value, mobilizing additional resources for development. Insufficient regular resources would therefore severely compromise UNDP's unique ability to respond rapidly to emergencies and address critical needs that other funding sources do not cover. The continued decline in regular resources also has serious implications for UNDP's ability to deliver the intended results of the Strategic Plan, restore and accelerate progress towards the SDGs and maintain robust oversight and accountability systems.
    trends-heading: Trends in regular and other resources, 2022–2025
    trends-copy: UNDP maintained broadly stable annual contributions throughout the period covered by the 2022–2025 Strategic Plan, averaging approximately $4.9 billion per year. Annual contributions reached a peak of $5.0 billion in both 2023 and 2025.
  funding-partner:
    heading: Resources by funding partner
    subheading: Regular and other resources, 2025
    copy: UNDP values all types of funding received from its partners—including Member States, multilateral organizations, non-governmental organizations, private and philanthropic organizations and financing institutions—as these resources enable it to deliver on its commitments. In 2025, UNDP received total annual contributions of $5 billion. Of this total, 36 percent was contributed by donor country governments, 32 percent by multilateral organizations and 32 percent by programme country governments.
    top-heading: Top 30 resource partners, 2025
    top-copy: In 2025, UNDP’s top 30 resource partners contributed $4.1 billion, or 82 percent of total annual contributions. These partners provided 89 percent of regular resources and 81 percent of other resource contributions.
  funding-channel:
    heading: Resources by funding channel
    copy: In 2025, UNDP benefited from increases in government development financing (17 percent) and third-party cost-sharing (7 percent).
    case-heading: The case for regular (“core”) resources in 2025
    types-heading: UNDP funding types and channels
    types:
      regular:
        heading: Regular (core) resources
        copy: Unearmarked funds that provide a flexible foundation for delivering results across the Strategic Plan.
      other:
        heading: Other resources
        copy: 'Earmarked funds that support specific themes, programmes or projects.<br>These include:'
      government:
        heading: Government financing
        copy: Voluntary funding through which programme country governments entrust domestic resources or loans from financial institutions to UNDP to support development initiatives in their respective countries.
      thematic:
        heading: Thematic funds
        copy: Softly earmarked pooled funds that support the achievement of outcomes aligned with the Strategic Plan and address issues that cut across thematic areas.
      cost-sharing:
        heading: Third-party cost-sharing
        copy: Earmarked contributions for a specific programme, project, region, or country.
      pooled:
        heading: UN pooled funds
        copy: UN inter-agency financing mechanisms that support clearly defined programmatic scopes and results frameworks, enabling global and local responses to humanitarian, development, environmental and peace-related challenges.
      vertical:
        heading: Vertical funds
        copy: Earmarked funds focused on a single area of development, such as health or the environment.
      reimbursable:
        heading: Reimbursable support services
        copy: Funds received for management and support services, including services provided by UN Volunteers and the Junior Professional Officer (JPO) Programme.

