  # Foreword: copy-part2 is the collapsible content
  foreword:
    overline: Foreword
    headline: Sustaining Trust in an Era of Uncertainty
    subhead:
    copy-part1: |
      <p>Stability is the result of continuous work: institutions that hold together instead of collapsing under pressure, economies that keep functioning through crisis instead of stalling, essential services that keep reaching people even as conflict disrupts everything around them. In 2025, that was UNDP’s work across 170 countries and territories, and it is the strongest case for backing UNDP.</p>
      <p>Trust is what makes that work possible, and governments and communities have placed it in UNDP for more than six decades. Flexible, predictable and long-term financing allows that work to continue, giving countries the tools to address interconnected challenges while building resilience for tomorrow.</p>
      <p>That trust is being tested in a harder environment. Official development assistance fell by 23.1 per cent in 2025, and contributions to the United Nations development system dropped sharply, including a 27 per cent cut to system-wide regular resources, the largest annual decline on record. Conflicts are proliferating faster than diplomacy can resolve them, climate shocks are arriving more often and costing more, and hard-won development gains are eroding. Expectations of UNDP have never been greater. The resources to meet them have rarely been tighter.</p>
    copy-part2: |
      <p>UNDP has not been immune to the downturn. In 2025, our core (regular) resources fell by 24 per cent to $442 million, just 9 per cent of total contributions and the lowest share in more than fifteen years. Funding has also fragmented, shortened and narrowed, precisely when countries need integrated, long-term solutions. Flexible resources remain essential, allowing UNDP to act early, operate in the most difficult environments, and combine expertise across sectors in ways that narrowly earmarked funding cannot.</p>
      <p>Our new <a href="https://strategicplan.undp.org" target="_blank" rel="noopener noreferrer">Strategic Plan 2026–2029</a> responds to this changing world. It places prevention and resilience at the centre of development, accelerated by digital and AI transformation, gender equality and sustainable finance. At the same time, UNDP is strengthening its own efficiency, optimizing its operating model and protecting the institutional capabilities that countries rely on.</p>
      <p>UNDP delivered results at scale in 2025, reaching 1.1 billion people across 170 countries and territories. More than half of our expenditure, $2.67 billion, were directed to crisis and fragile settings, including Afghanistan, Gaza, Haiti, Myanmar, Sudan, and Ukraine. We earned our twentieth consecutive clean audit opinion and directed 91 cents of every programmatic dollar to development activities.</p>
      <p>Every $1 of core funding unlocked $10 in additional resources, and UNDP has helped countries align and leverage $920 billion in public and private finance for the Sustainable Development Goals since 2022. Investing in UNDP means strengthening national institutions and multiplying resources for sustainable development.</p>
      <p>We are grateful to the partners who maintained or increased their core contributions during a period of significant fiscal constraint, particularly the Governments of Austria, Belgium, Luxembourg and Spain. We are grateful in equal measure to the ten partners whose multi-year commitments give UNDP greater predictability: Belgium, Canada, Denmark, Ireland, Luxembourg, the Kingdom of the Netherlands, New Zealand, Qatar, Sweden and Türkiye. The continued growth of Government Development Finance, through which programme countries invest their own resources in partnership with UNDP, is one of the strongest expressions of confidence in our work.</p>
      <p>The challenges before us cannot be addressed by any institution acting alone. Reversing current funding trends will require renewed commitment to predictable, flexible, multi-year financing; broader engagement from traditional and emerging partners; and sustained investment by programme countries themselves. Without it, six decades of development progress begins to reverse, and the countries least able to absorb further shocks will feel it first. That investment strengthens the capacity of UNDP and the wider multilateral system to support countries in navigating an increasingly uncertain world.</p>
      <p>As you explore this year’s Funding Compendium, I hope it leaves you in no doubt that every contribution entrusted to UNDP delivers measurable results, creates value far beyond its initial investment, and helps build a more resilient, prosperous and sustainable future for all.</p>
    photo-credit: 'Photo: Fouad Juez'
    photo-alt: Susan Brown
    name: Susan Brown
    position-title: Assistant Secretary-General and Assistant Administrator <br> Bureau of External Relations and Advocacy <br> United Nations Development Programme
  # Executive summary
  exec-summary:
    headline: Executive summary
    copy: "<p>The Funding Compendium presents the annual contributions received by UNDP from its funding partners through various channels. These include regular (core) resources and other resources and range from softly earmarked thematic funds to tightly earmarked funds for specific programmes or projects.</p> <p>The year 2025 tested UNDP’s agility, resilience and ability to respond to complexity. During the global decline in official development assistance (ODA) in 2025, UNDP’s annual contributions from its partners remained broadly stable at $5 billion, a 2 percent increase compared to 2024. However, despite this overall stability, the quality of funding continued to deteriorate. In 2025, regular resources declined to $442 million, down by 24 percent from $581 million in 2024.</p> <p>Despite the record-low level of regular resources received in 2025, UNDP delivered $4.9 billion in programme expenditure, allocated 91 cents of every programmatic dollar to development activities and continued to demonstrate the catalytic value of regular resources by mobilizing approximately $10 in other resources for every $1 of core funding.</p> <p>The declining trend in regular resources increasingly constrains UNDP’s ability to adequately support country programming, respond to crises, invest in innovation and maintain the institutional capabilities that underpin integrated development solutions.</p>\n"
  # Transparency heading
  transparency:
    headline: Commitment to transparency and accountability
  # Case for regular resources cards
  action:
    swiper:
      flexible-foundation:
        title: Flexible foundation for impact
        body: Core funding provides UNDP with flexible, predictable resources that enable it to respond rapidly to emerging challenges while maintaining a focus on long-term development goals in 170 countries and territories.
      reaching-most-in-need:
        title: Reaching those most in need
        body: 'The lion’s share of the core programme budget is channelled through country programmes. In 2022–2025, over 80 percent of these resources (TRAC-1, TRAC-2 and TRAC-3) were allocated to least developed countries, and over 70 percent to low-income countries, prioritizing the “last mile”—the poorest and most excluded populations.'
      multiplier-effect:
        title: Multiplier effect
        body: Core funding is a smart investment and acts as a catalyst for additional investment.
      crisis-readiness:
        title: Crisis readiness and response
        body: UNDP spends 52 percent of its resources in fragile contexts, investing in all 61 countries defined as fragile by the OECD. Core resources enable early warning analysis, crisis prevention advocacy and immediate responses to conflicts and disasters. In Ukraine, UNDP's core-funded presence supported the assessment of 94,000 km² of potentially mine-contaminated land, including over 36,000 km² of agricultural land, while expanding access to digital public services for 466,101 internally displaced people and strengthening both recovery and resilience.
      pioneering-innovation:
        title: Pioneering innovative approaches to development
        body: Core funding enables UNDP to push the boundaries on frontier development issues. For example, it supports the Accelerator Labs Network across 115 countries, which has identified more than 6,000 grass-roots solutions to development challenges.
      governance-electoral:
        title: Governance and electoral support
        body: From 2022–2025, UNDP supported processes involving 911.3 million registered voters across 78 elections in 51 countries. In the Philippines, for example, core funding enabled UNDP to support the uptake of digital tools to increase transparency in campaign financing and strengthen voter education, reaching 2,260 voters, including youth, women, Indigenous communities and traditional leaders.
      digital-transformation:
        title: Digital transformation
        body: With core resources, UNDP helps countries harness digital technologies to improve governance, service delivery and inclusion. In 2025, UNDP supported digital transformation in over 130 countries, enabling 49 million people to benefit from digital services and technologies while helping governments strengthen digital public infrastructure and innovative solutions for sustainable development.
      climate-action:
        title: Climate action at scale
        body: As the largest UN provider of climate assistance, UNDP helps nations strengthen their environmental commitments, secure vital financing and implement equitable energy transitions. Initially launched with core resources, UNDP's Climate Promise has grown to support 90 percent of developing countries in designing and implementing ambitious Nationally Determined Contributions.
      operational-excellence:
        title: Operational excellence
        body: Core funding maintains UNDP’s global infrastructure and quality standards, supporting independent oversight functions, including evaluation, ethics and development effectiveness. In 2024, UNDP received its 20th consecutive clean audit from the UN Board of Auditors, having stewarded over $100 billion in total revenue over 20 years while maintaining the highest standards of accountability and transparency.
      efficiency-un-system:
        title: Efficiency across the UN system
        body: Core resources also drive greater efficiency and improve coordination across the entire UN system. UNDP is the single largest contributor to the UN Resident Coordinator System. It delivers dependable services to over 70 UN entities and manages 136 UN common premises globally, providing common services at the country level.
      trust-transformation:
        title: Trust and transformation
        body: By investing in core funding, partners support a model that promotes national agency, reduces dependency and creates lasting, transformative change.
