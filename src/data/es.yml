futuresmart-page:
  intro:
    para1: >
     Durante los últimos ocho años, el PNUD ha modernizado sus operaciones de manera significativa: 
     <span class="text-extrabold">92 centavos de cada dólar se destinan ahora a programas y servicios</span>. 
     Los siguientes son algunos de los aspectos más destacados:

    para2: >
     Gracias a las recomendaciones de la revisión independiente del modelo institucional, realizada en 2024, las nuevas mejoras configurarán un PNUD 
     <span class="text-extrabold">más ágil, más rápido y con mayor capacidad de respuesta</span>. 
    icons:
      quantum: >
        El <span class="text-extrabold">sistema de planificación de los recursos institucionales Quantum</span>, que actualmente comparten 10 organismos de las Naciones Unidas
      automation: >
        La <span class="text-extrabold">automatización de unos 3.000 procesos institucionales</span> mediante una plataforma global de servicios compartidos más sólida
      operation: >
        La actuación como <span class="text-extrabold">eje operacional</span> para más de 70 entidades de las Naciones Unidas en 121 países
      carbon-footprint: > 
        
        La introducción de mejoras energéticas que nos colocan en la senda adecuada para  <span class="text-extrabold">reducir nuestra huella de carbono a la mitad</span> de aquí a 2030

  subtopics:
    people-culture:
      heading: Personas y cultura
      copy: >
        En la tercera fase de la estrategia “People for 2030”, el PNUD seguirá construyendo una cultura organizativa basada en el compromiso, el aprendizaje continuo y una mentalidad de crecimiento. Utilizamos datos para optimizar la productividad y el rendimiento, al tiempo que adecuamos mejor el capital humano a los objetivos de la organización mediante un nuevo mercado interno de talento.
   
    digital-data:
      heading: Datos, tecnología digital e IA
      copy: >
        El PNUD utiliza análisis basados en IA para transformar datos complejos en información práctica y apoyar una programación y unas políticas mejor integradas. El nuevo Centro Digital, de IA y de Innovación reforzará la colaboración entre los diversos equipos y con otros organismos, además de acelerar la innovación.
    
    business-transformation:
      heading: Transformación institucional
      copy: >
        El sistema de planificación de los recursos institucionales Quantum, los servicios globales compartidos y la gestión moderna de los recursos humanos siguen aumentando la eficiencia, la eficacia y la optimización de los recursos, preservando al mismo tiempo la rendición de cuentas y la transparencia. 

    risk-management:
      heading:  Gestión del riesgo
      copy: >
        El PNUD cuenta con un marco de gestión del riesgo institucional bien establecido. Integraremos de manera más proactiva la gestión de riesgos en todos los programas y operaciones con el objetivo de identificar antes los riesgos y gestionarlos mejor. Los riesgos en la aplicación del Plan Estratégico se examinarán periódicamente y se mantendrá informada a la Junta Ejecutiva.
    
    results:
      heading: Compromiso con el logro de resultados
      copy: >
        Los marcos de evaluación del impacto del PNUD han evolucionado para incluir parámetros más sofisticados, como el índice de pobreza multidimensional y el índice de desarrollo humano ajustado por las presiones planetarias. El PNUD sigue perfeccionando estos mecanismos para captar mejor la forma en que sus intervenciones cambian la vida de las personas. 
    
    transparency:
      heading: Transparencia y rendición de cuentas
      copy: >
        Sobre la base de sus auditorías sin reservas de 100.000 millones de dólares en gasto para el desarrollo a lo largo de 20 años y su clasificación en el nivel superior del índice de transparencia de la ayuda desde 2011, el PNUD avanza en la rendición de cuentas en tiempo real y basada en datos. Las nuevas iniciativas incluyen plataformas digitales de nueva generación para la supervisión del rendimiento en tiempo real. No publicamos solo los éxitos, sino también las enseñanzas extraídas de los fracasos, una cultura de mejora continua.

# ****************************************************************************************************

partnerships-page:
  title: >
    Alianzas para el progreso
  ecosystem:
    title: >
      Ecosistema  <span style="font-weight: 350;">de <br> alianzas </span>
    infographic: "partnerships-ecosystem-sp.png"
    copy: 
      column1:
        para1: Las relaciones de larga data del PNUD con sus <span class="text-extrabold">asociados gubernamentales</span> siguen siendo fundamentales en la obtención de resultados. Los Gobiernos proporcionan los recursos que el PNUD necesita para ejecutar sus programas de los países, coordinados con los equipos de las Naciones Unidas en los países y adaptados al contexto local. 
        para2: El <span class="text-extrabold">sector privado</span> es un asociado indispensable para lograr la transformación sistémica. El PNUD colabora con el sector privado a fin de ajustar la innovación empresarial, el capital y los conocimientos especializados a las prioridades nacionales de desarrollo. 
        para3: Amplificamos nuestra incidencia aprovechando la financiación combinada y los bonos vinculados a la sostenibilidad, al tiempo que nos asociamos con las <span class="text-extrabold"> instituciones financieras internacionales</span> (IFI) para proporcionar asistencia técnica y financiación complementarias.

      column2:
        para1: Ampliamos los recursos, los conocimientos especializados y la experiencia de los que disponen nuestros asociados mediante el fomento de la cooperación Sur-Sur y triangular, así como la ayuda a los Gobiernos para aprovechar los diversos recursos de otros <span class="text-extrabold">organismos de las Naciones Unidas</span>.
        para2: Continuamos diversificando nuestras alianzas con organizaciones filantrópicas, el sector privado, las IFI, el mundo académico, la sociedad civil y las organizaciones no gubernamentales (ONG), de modo que contribuimos a <span class="text-extrabold"> implicar a una mayor variedad de partes interesadas en el desarrollo</span>. 
  unds:
    heading: El sistema de las Naciones Unidas para el desarrollo 
    copy:
      para1: >
        La revisión cuadrienal general de la política relativa a las actividades operacionales del sistema de las Naciones Unidas para el desarrollo, llevada a cabo en 2024, pone de relieve la necesidad de coherencia, eficiencia, eficacia y rendición de cuentas. El PNUD aprovecha sus conocimientos técnicos, sus redes y su presencia mundial para contribuir a estos esfuerzos colectivos.
      para2: >
        Bajo el liderazgo de los países, el PNUD alinea sus programas para los países con las prioridades nacionales a partir de los resultados de dichos programas obtenidos de los Marcos de Cooperación de las Naciones Unidas para el Desarrollo Sostenible. En colaboración con los equipos en los países, dirigidos por los coordinadores residentes, ejecutamos programas integrados y con base empírica que abordan cuestiones de desarrollo complejas, aprovechando nuestra experiencia en previsión y pensamiento sistémico. 
      para3: >
        El PNUD sigue siendo el mayor participante en los fondos mancomunados y programas conjuntos de las Naciones Unidas, con más de 240 millones de dólares en programación conjunta. La complementariedad es crucial. Cultivamos sinergias interinstitucionales en el diseño de políticas, la ejecución de programas y los mecanismos de elaboración de informes para evitar la duplicación y la fragmentación de esfuerzos. 
      para4: >
        La incidencia del sistema de las Naciones Unidas para el desarrollo se multiplica gracias a los activos alojados por el PNUD, que proporcionan servicios y conocimientos especializados al sistema:
    
    unv:
        logo: "unv-sp.png"
        alt: "UN Volunteers logo"
        title: "Más personas:"
        copy: en 2024, 14.631 <span class="text-extrabold">Voluntarios de las Naciones Unidas</span> (VNU), de 181 nacionalidades, prestaron servicio a 59 entidades de las Naciones Unidas en 169 países.
    
    uncdf:
        logo: "uncdf.png"
        alt: "UNCDF logo"
        title: "Más inversión:"
        copy: al integrar las capacidades e instrumentos financieros del <span class="text-extrabold">Fondo de las Naciones Unidas para el Desarrollo de la Capitalización</span> (FNUDC) en su programación, el PNUD fomenta el crecimiento sostenible, la creación de empleo y las oportunidades económicas para todas las personas. 
    
    mptf:
        logo: "mptf.png"
        alt: "Multi-Partner Trust Fund Office logo"
        title: "Más trabajo conjunto:"
        copy: la <span class="text-extrabold">Oficina de los Fondos Fiduciarios de Asociados Múltiples</span> (OFFAM) crea un fondo mancomunado, con una dotación superior a 1.000 millones de dólares al año, para obtener resultados más sólidos a gran escala.
    
    unossc:
        logo: "unossc.png"
        alt: "UNOSSC logo"
        title: "Más cooperación:"
        copy: la <span class="text-extrabold">Oficina de las Naciones Unidas para la Cooperación Sur-Sur</span> (UNOSSC) promueve un alto nivel de desarrollo humano mediante el desarrollo y la transferencia de tecnología, la cooperación financiera, el aprendizaje entre iguales y la creación de capacidades, especialmente en innovación digital y de gobernanza.

  
# ****************************************************************************************************

popups: 
  prosperity:
    heading: Prosperity for all
    copy:
      para1: La pobreza extrema sigue siendo una realidad cotidiana para el 9 % de la población mundial. 
      para2: >
        El PNUD se centra en la creación de prosperidad para todas las personas, sin abandonar nuestro firme empeño por los programas contra la pobreza y la desigualdad y nuestro compromiso de no dejar a nadie atrás. Este cambio supone una adaptación a la evolución de las aspiraciones de nuestros asociados, que van más allá del objetivo de un umbral mínimo de pobreza para construir economías y sociedades dinámicas y resilientes en las que todas las personas puedan prosperar. 
      overline-icons: >
        El PNUD contribuye a reducir la pobreza y a crear prosperidad mediante:
      icon1: la ampliación de las oportunidades de las personas y las empresas para acceder a activos productivos, empleos y medios de vida dignos, así como para desarrollar el capital humano
      icon2:  la mejora de la protección frente a las perturbaciones, las crisis y la vulnerabilidad multidimensional por medio de la reducción de riesgos, acceso a servicios esenciales y protección social
      para3: La prosperidad para todas las personas debe incluir la mejora de las oportunidades económicas de las mujeres y la superación de los obstáculos a su plena participación económica, incluido su acceso a los derechos de propiedad, los servicios financieros y la igualdad salarial. 
      para4: Los países siguen diferentes vías de desarrollo, por lo que el PNUD adapta su trabajo a los contextos y grupos de población de cada país. El progreso hacia la prosperidad se mide utilizando parámetros multidimensionales que evalúan tanto las oportunidades económicas como la expansión de las capacidades de las personas, incluidos los índices de desarrollo humano ajustados por la desigualdad y por el género. 

  governance:
    heading: Gobernanza eficaz
    copy:
      para1: Una gobernanza responsable, inclusiva y eficaz es fundamental para el desarrollo humano. El PNUD promueve una gobernanza responsable, centrada en las personas y basada en los derechos, en consonancia con los principios intergubernamentales de gobernanza eficaz para el desarrollo sostenible. 
      para2: >
        La capacidad del PNUD para integrar la gobernanza en todo su trabajo, como dimensión central del cambio sistémico, nos confiere una ventaja a la hora de abordar los desafíos interconectados que plantea el desarrollo sostenible.
      para3: Gracias al pensamiento sistémico, la innovación y la prospectiva estratégica, el PNUD ayuda a los países a desarrollar una gobernanza y formulación de políticas más ágiles y anticipatorias, así como a proporcionar oportunidades económicas y servicios que respondan a las necesidades, entre ellos, una infraestructura pública digital y un mayor acceso a los servicios a través de la digitalización y la IA.
      para4: La gobernanza democrática, los derechos humanos y el estado de derecho son fundamentales para que las sociedades y las economías prosperen, además de contribuir a mantener la paz y la seguridad humana. Se observa un aumento de la demanda de apoyo del PNUD en los diálogos políticos y los procesos electorales, incluso en contextos de transición y crisis. Las alianzas con gobiernos locales y nacionales, parlamentos y la sociedad civil ayudan a construir una esfera pública abierta en la que todas las personas puedan participar.
      para5: En situaciones de conflicto y violencia, el PNUD fomenta la cohesión social y refuerza la seguridad comunitaria y la consolidación de la paz local mediante el diálogo, la mediación interna y los enfoques basados en zonas.
    
  crisis:
    heading: Resiliencia ante las crisis
    copy:
      para1: Aunque las crisis son muy diversas, la amenaza que suponen para el desarrollo humano y la seguridad de las personas es significativa y va en aumento. Desde el primer día de una crisis, el PNUD se centra en proteger los logros en materia de desarrollo y reducir el riesgo, sentando las bases para la recuperación y para dejar de depender de la ayuda humanitaria.
      para2: >
        Actúa como “constructor de puentes” entre los sistemas humanitario, de desarrollo y de consolidación de la paz, ayudando a los equipos de las Naciones Unidas y humanitarios en los países, dirigidos por los coordinadores residentes y humanitarios, a mantener la continuidad en todas las fases de la respuesta y a avanzar en el desarrollo a largo plazo.
     
      para3: El PNUD desempeña un papel clave en la estabilización y la recuperación temprana, que incluye la ampliación de las oportunidades económicas de las mujeres y su influencia en la toma de decisiones. Asimismo, el PNUD fomenta la participación de la juventud en la gobernanza democrática y amplifica sus voces en los procesos de paz.

      para4: El compromiso del PNUD de “permanecer y cumplir” en los entornos más difíciles permite mantener una implicación constante en todas las fases de una crisis. Una sólida capacidad operacional y una presencia mundial nos permiten prestar servicios a escala, incluso en zonas remotas y de alto riesgo. Las relaciones de larga data y las redes locales facilitan que operemos en entornos afectados por conflictos o políticamente complejos donde otros agentes no pueden permanecer.
  
  planet:
    heading: Planeta sano
    copy:
      para1: El desarrollo sostenible no es posible sin un planeta sano.
      para2: >
        El PNUD es uno de los principales conectores en el nexo entre planeta y desarrollo, aporta soluciones integradas a los desafíos que plantean el cambio climático, las catástrofes, la pérdida de biodiversidad, la energía, los productos químicos y los desechos, al tiempo que promueve las prioridades de desarrollo en materia de gobernanza, prosperidad y resiliencia. 
      para3: El PNUD pretende traducir los compromisos globales, contraídos en virtud del Acuerdo de París, el Marco Mundial de Biodiversidad de Kunming-Montreal, el Protocolo de Montreal y otros acuerdos internacionales, en acciones eficaces a nivel local. Ayudamos a los países a evaluar sus opciones para lograr transiciones justas y sostenibles, así como a aprovechar nuevas ideas encaminadas a abordar el reto de la financiación. 
      overline-icons: >
       El PNUD trabaja con las siguientes entidades:
      icon1: los países, a fin de mejorar la coherencia de las políticas en torno a sus promesas nacionales y cumplir estos compromisos de forma que respondan al contexto local
      icon2: los Gobiernos, la sociedad civil, las instituciones financieras y el sector privado, con el objetivo de invertir conjuntamente en acciones que promuevan la prosperidad y, al mismo tiempo, protejan el planeta
      para4: A través de la iniciativa Climate Promise 2025, el PNUD ha creado una plataforma para involucrar al sistema de las Naciones Unidas en el apoyo a los objetivos y estrategias climáticas de los países.


  digital:
    heading: Transformación digital y de la IA
    copy:
      para1: >
         Los rápidos avances digitales y el auge de la IA están transformando las economías, la gobernanza y las sociedades. Sin embargo, las oportunidades vienen acompañadas de riesgos: amenazas para la ciberseguridad, la privacidad de los datos, el sesgo algorítmico y el creciente impacto ambiental de las tecnologías digitales. Una de cada tres personas en el mundo sigue sin tener conexión a Internet. Esto hace más urgente el apoyo del PNUD a los países que trabajan por una conectividad significativa en un futuro digital abierto, libre y seguro. 
      para2: >
       Los vastos conocimientos especializados del PNUD y su enfoque orientado a los países nos permiten apoyar la transformación digital holística de un modo integrado y sistémico. 
      para3: >
        El PNUD ha trabajado con más de 120 países para aprovechar las tecnologías digitales en respaldo de su desarrollo. Ello incluye ayudar a instituciones y particulares a desarrollar las capacidades necesarias para acceder a la tecnología y los datos digitales y utilizarlos, así como apoyar a los países en la implantación de una infraestructura pública digital sólida, como los sistemas digitales de pago e identificación seguros.
      para4: >
        Trabajamos con nuestros asociados en políticas, normativas y planes de desarrollo que garanticen un uso seguro y responsable de las tecnologías digitales y emergentes. También estamos intensificando nuestros esfuerzos por hacer frente a los perjuicios digitales, incluida la desinformación y la polarización en línea. Además, promovemos soluciones sostenibles para suministrar electricidad a la infraestructura digital con un menor costo ambiental.
        

  gender:
    heading: Igualdad de género
    copy:
      para1:  >
        La realización de los derechos de las mujeres y la igualdad de oportunidades forman parte integrante del desarrollo sostenible y pueden acelerar los resultados en todos los ámbitos. Como complemento de la labor de ONU-Mujeres, el PNUD diseña sus intervenciones de manera que tengan una repercusión deliberada en la igualdad de género, considerada por los asociados como una de las áreas en las que su trabajo resulta más eficaz. El PNUD cumple o supera el 94 % de los objetivos del Plan de Acción para Todo el Sistema de las Naciones Unidas.
      para2: >
        A través de sus relaciones de confianza con los Gobiernos, el PNUD está en disposición de ayudar a promover el empoderamiento de las mujeres en todas las dimensiones del desarrollo sostenible. 
     
      icon1: El PNUD acelera el liderazgo y la participación igualitaria de las mujeres en las instituciones públicas, los cargos electos, el poder judicial y el sector privado. 
      icon2: El PNUD trabaja para mejorar las oportunidades económicas de las mujeres a través de la iniciativa empresarial, la creación de empleo y el fomento de la capacidad, así como para reconocer, reducir y redistribuir el trabajo de cuidados no remunerado que realizan las mujeres. 
      icon3: En contextos de crisis, el PNUD refleja los intereses y la voz de las mujeres y las niñas. 
     
      para3: >
        Crece la demanda de ayuda para impulsar un cambio sistémico que derribe las barreras que limitan las oportunidades de las mujeres. Trabajamos con los Gobiernos nacionales, compartiendo los enfoques que han tenido éxito en los distintos países y regiones, y con los gobiernos locales, que están más cerca de los ciudadanos y pueden convertir las políticas nacionales en beneficios reales para mujeres y hombres. 

  finance:
    heading: Financiación sostenible
    copy:
      para1:  >
        El déficit de financiación para el desarrollo no es solo un déficit financiero; refleja la falta de adecuación de los flujos de capital a las prioridades del desarrollo sostenible. A fin de corregir esta situación es necesario pasar de la ampliación de la asistencia para el desarrollo a la transformación de sus sistemas de financiación. El valor diferencial del PNUD reside en las siguientes acciones:
      icon1: tender puentes entre los sistemas de financiación pública y privada
      icon2: reunir a los agentes financieros y del desarrollo para alinear la inversión con el desarrollo sostenible a nivel nacional
      para2: >
        El PNUD trabaja en las intersecciones de la financiación, la gobernanza, el clima, la naturaleza y el desarrollo con el objetivo de acelerar este último y ampliar las oportunidades de inversión en las economías emergentes y en desarrollo.
      para3: >
       Colaboramos con los países para reforzar sus marcos reguladores, institucionales y normativos, de forma que mejore la estabilidad de la gobernanza financiera y la transparencia de la asignación de capitales. Los marcos nacionales de financiación integrados en 86 países ya han permitido movilizar 16.000 millones de dólares de los Estados Unidos en nueva financiación y alinear más de 32.000 millones de dólares con el desarrollo sostenible.   
      para4: >
        Trabajamos con las instituciones de financiación del desarrollo y con el sector privado para desarrollar a mayor escala determinados instrumentos de financiación, como la financiación mixta, los bonos verdes, los préstamos vinculados a la sostenibilidad y las inversiones respaldadas por seguros. Ayudamos a los Gobiernos a movilizar recursos nacionales a través de impuestos progresivos, presupuestos alineados con los Objetivos de Desarrollo Sostenible (ODS) y políticas fiscales basadas en resultados.


