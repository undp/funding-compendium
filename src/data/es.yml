homepage:
  hero:
    title: >
      Plan Estratégico 
      <br> 2026-2029
    subtitle: >
      Apoyando el progreso de los países hacia el desarrollo humano
  intro:
    para1: >
      A lo largo de seis decenios, el PNUD ha dado forma al progreso del desarrollo humano proporcionando apoyo integrado a gran escala para mejorar la vida de millones de personas en todo el mundo.
    para2: >
      El PNUD seguirá apoyando el avance de los países hacia un alto nivel de desarrollo humano, al tiempo que protege el planeta. Cuatro objetivos estratégicos —prosperidad para todas las personas, gobernanza eficaz, resiliencia ante las crisis y planeta sano— definen sus directrices estratégicas, impulsadas por tres aceleradores: la transformación digital y de la inteligencia artificial (IA), la igualdad de género y la financiación sostenible. Todas ellas se basan en el compromiso con los derechos humanos y con el principio de no dejar a nadie atrás. 
    para3: >
      El Plan Estratégico se centra en lo que mejor hace el PNUD: apoyar el cambio sistémico mediante soluciones integradas de desarrollo motivadas por las prioridades nacionales. 

  # ************************* What we have learned *************************

  action:
    heading: Qué hemos aprendido
    intro: >
      Para diseñar el Plan Estratégico, <span class="text-extrabold"> el PNUD realizó más consultas que nunca, con unos 600 asociados de 116 países</span>. El plan se basa en una gran cantidad de datos y enseñanzas extraídas: la evaluación independiente y el examen de mitad de período del Plan Estratégico 2022-2025, una revisión independiente del modelo institucional del PNUD y <a href="https://docs.aiddata.org/reports/ltl-2025/full-report.min.html" target="blank">una encuesta a 11.000 asociados para el desarrollo</a> en 147 países.
    
      Las <span class="text-extrabold"> observaciones</span> siguientes influyeron en el diseño del plan:
    
    swiper:
      trust-matters:
        title: "La confianza importa"
        body: 
          El PNUD es el único organismo de las Naciones Unidas clasificado sistemáticamente entre los cinco principales asociados para el desarrollo por los líderes con los que trabajamos. Al reconocer la importancia de la apropiación nacional, el PNUD trabaja junto a sus asociados y evoluciona al ritmo de las prioridades de estos en materia de desarrollo. Los asociados valoran el alcance del PNUD, a todos los niveles y en multitud de organismos gubernamentales, a través de relaciones duraderas basadas en la confianza mutua. 
      integrated-approach:
        title: "Enfatizar el enfoque integrado"
        body: "Los asociados desean contar con el apoyo de expertos en los puntos de intersección de los diferentes temas, como la reducción de la pobreza mediante el aumento de las oportunidades de empleo o la promoción de los derechos de las mujeres. Este planteamiento funciona: el examen de mitad de período constató que el impacto del PNUD aumentaba un 3 % por cada 10 % de intensificación de su enfoque intersectorial."

      systems-not-sectors:
        title: "Hay que fijarse en los sistemas, no en los sectores"
        body: "La evaluación reconoció que el enfoque sistémico del PNUD es “el motor más importante de la transformación estructural”, aunque señaló que todavía queda mucho por hacer. Ello se plasma en nuestra política y prácticas de cartera, que reúnen a múltiples asociados y activos en torno a una misión común."

      implementation-policy-support:
        title: "Gran importancia del apoyo normativo y a la ejecución"
        body: "Nuestra influencia creció en el último decenio. El 98 % de los dirigentes del sector privado encuestados calificaron el apoyo del PNUD a la ejecución como bastante o muy útil. El 91 % de los responsables gubernamentales compartían esta opinión."

      core-resources:
        title: El impacto a largo plazo depende de los recursos básicos
        body: 
          La disminución de la financiación básica dificulta la flexibilidad del PNUD, la aplicación de soluciones integradas y la promoción de cambios duraderos. La obtención de recursos ordinarios sostenibles es fundamental para que el PNUD tenga una incidencia significativa en el desarrollo.

      risk-awareness:
        title: "Conciencia del riesgo para la resiliencia"
        body: "La integración de la concienciación sobre los riesgos en toda nuestra labor ha ayudado significativamente al PNUD a fomentar la resiliencia. Nuestra capacidad para permanecer y cumplir en contextos complejos y de crisis ayuda a mantener los esfuerzos de desarrollo cuando otros agentes podrían retirarse. Nuestra influencia entre los líderes en situaciones frágiles ha aumentado."

      future-skills:
        title: "Capacidades orientadas al futuro para seguir en cabeza"
        body: "Hoy en día, más de la mitad de los proyectos del PNUD incluyen un componente digital. El PNUD obtuvo una calificación del desempeño excepcional entre las 51 organizaciones de las Naciones Unidas en materia de digitalización, datos, previsión estratégica, innovación y ciencias del comportamiento. Las inversiones en estas áreas están creando una cultura centrada en el aprendizaje y en el pensamiento orientado al futuro."

    
  # ************************* Investing in UNDP *************************

  value:
    heading: Inversión en PNUD
    overline: 
      Financiar la creación de valor
    intro: El Plan Estratégico aprovecha las inversiones en infraestructura del PNUD durante 60 años. 
    icons:
      countries: >
        Opera en <br><span class="text-extrabold" style="color: #F1439A;">170 países y territorios</span><br><br>
      hubs: >
        <span class="text-extrabold" style="color: #4339CB;">Centros regionales</span> Addis Abeba, Ammán, Bangkok, Estambul, Panamá
      un-system: >
        <span class="text-extrabold" style="color: #FF800B;">Centraliza activos del sistema de las Naciones Unidas: </span><br> OFFAM, FNUDC, UNOSSC, VNU
      rating: Valorado por el 90 % de los líderes como “muy útil” o "bastante útil" 
      money: 92 centavos de cada dólar llegan a los programas de desarrollo 
      transparency: >
        Clasificado sistemáticamente en el  <span class="text-extrabold" style="color: #EC5038;">el índice de transparencia de la ayuda</span> desde 2011

  
    para1: >
        La estrategia del PNUD se basa en garantizar que <span class="text-extrabold">cada dólar tenga el máximo impacto en el desarrollo</span> y que <span class="text-extrabold">el PNUD siga siendo un asociado fiable</span> en un mundo incierto. 
    para2: >
        En un entorno de financiación complejo, el PNUD ha adoptado desde principios de 2025 una serie de medidas de austeridad con el objetivo de reducir los gastos operacionales, optimizar el uso de recursos y mejorar su movilización. Entretanto, continúan las inversiones en áreas con alto potencial de retorno, como el desarrollo de la cartera de programas y las capacidades digitales y de IA. 
    para3: >
        Los <span class="text-extrabold">recursos ordinarios (básicos)</span> constituyen la base financiera del PNUD, que le permite llevar a cabo una planificación a largo plazo, responder con rapidez, impulsar la innovación y llegar a quienes se están quedando más atrás: una inversión en multilateralismo. Sin embargo, las contribuciones a los recursos ordinarios han descendido a tan solo un 12 % de los recursos totales. Es esencial restaurar estos fondos para preservar la imparcialidad, el alcance mundial y la capacidad del PNUD de atender a los países en función de sus necesidades. 

  # ************************* Overarching goal *************************

  goal:
    heading: Objetivo general
    copy:
      para1: >
         El Programa de las Naciones Unidas para el Desarrollo (PNUD) trabaja con los diferentes países para que las personas tengan más posibilidades de disfrutar de un futuro más justo y sostenible, tal como se prevé en la Agenda 2030 para el Desarrollo Sostenible: un futuro en el que ningún país tenga que elegir entre el desarrollo humano y la salud del planeta, en el que la prosperidad y la sostenibilidad avancen juntas sin dejar a nadie atrás. Es la próxima frontera de la humanidad y, con el apoyo adecuado, está a nuestro alcance. 
      para2: >
       Mediante una acción integrada, basada en datos y alineada con las prioridades nacionales, el PNUD trabaja para acelerar el desarrollo humano y, al mismo tiempo, aliviar las presiones sobre el planeta. El objetivo general del Plan Estratégico es acompañar a los países en esta dirección.

  # ************************* Strategic framework / what we do *************************

  framework:
    overline: Crear valor
    heading: Qué hacemos
    intro:
      para1: >
        El Plan Estratégico se ha diseñado en torno a un menor número de resultados integrados para centrarse más claramente en lo que los datos demuestran que el PNUD hace mejor: lograr cambios a nivel de los sistemas mediante soluciones integradas motivadas por las prioridades nacionales. 
      para2: >
        Un marco de <span class="text-extrabold">cuatro objetivos estratégicos, impulsados por tres aceleradores del progreso</span>, captan el efecto que tiene el PNUD en la vida de las personas y su contribución al desarrollo humano. Dicho marco aprovecha los puntos fuertes de la organización, hace hincapié en la interconexión de los objetivos y los aceleradores, y permite crear opciones de desarrollo adaptadas a las prioridades de cada país. 
    infographic: "infographic-01-sp.svg"
    infographic-mobile: "infographic-01-mobile-sp.svg"

  # ************************* Strategic objectives *************************

  objectives:
    heading: Objetivos estratégicos
    intro: >
      Cuatro objetivos estratégicos —prosperidad para todas las personas, gobernanza eficaz, resiliencia ante las crisis y planeta sano— definen las directrices estratégicas del PNUD.

    buttons:
      prosperity: Prosperidad para todas las personas
      governance: Gobernanza <br>eficaz
      resilience: Resiliencia ante <br>las crisis
      planet: Planeta <br> sano

  # ************************* Pathways to human development *************************

  human-dev:
    heading: Caminos al desarrollo humano
    intro: >
      Los objetivos estratégicos y los aceleradores impulsan colectivamente el desarrollo humano al tiempo que reducen las presiones planetarias, medidas por el <a href="https://hdr.undp.org/planetary-pressures-adjusted-human-development-index?_gl=1*l4da30*_ga*MTc4OTU4NTIzNy4xNzM4ODU3OTgw*_ga_3W7LPK0WP1*czE3NTg1MTg3MTIkbzE3OSRnMSR0MTc1ODUyMzk0MSRqMjQkbDAkaDA.#/indicies/PHDI" target="_blank" class="text-extrabold">índice de desarrollo humano ajustado por las presiones planetarias (IDHP)</a>. 
    infographic: "infographic-02-sp.jpg"
    infographic-mobile: "infographic-02-mobile-sp.jpg"

  # ************************* Accelerators *************************

  accelerators:
    heading: Aceleradores
    intro: >
      La transformación digital y de la IA, la igualdad de género y la financiación sostenible son potentes aceleradores que impulsan el progreso hacia un cambio sistémico. 
    list:
      item1: >
        Digital advancements expand opportunities, improve public services, enhance civic engagement and speed up response to crisis.
      item2: >
        When women are empowered through laws and public policies, societies are more resilient, economies grow faster, poverty and inequality decrease.
      item3: >
        Better alignment of capital flows with sustainable development priorities can unlock new pathways to prosperity and a healthy planet.
    buttons:
      digital: Transformación digital y de la IA
      gender:  Igualdad <br>de género
      finance: Financiación sostenible
    
    
    digital:
      title: Digital and AI transformation
      content: >
            <p>Rapid digital advancements and the rise of AI are transforming economies, governance and societies.
              Yet with opportunity comes risk: threats to cyber-security, data privacy, algorithmic bias and the
              growing environmental impact of digital technologies. One in three people worldwide is still
              offline. This lends urgency to UNDP support to countries working towards meaningful connectivity in
              an open, free and secure digital future.</p>    

              <p>UNDP’s broad expertise and country-driven approach allow us to support holistic digital
              transformation in an integrated, systemic way.</p>

              <p>UNDP has worked with over 120 countries to leverage digital technologies to support their
              development. This includes helping institutions and people develop the capabilities to access and
              use digital technology and data; and supporting countries to implement robust digital public
              infrastructure, like digital payment and secure digital ID systems.</p>

              <p>With our partners we work on policies, regulations and development planning that ensure safe,
              secure and responsible use of digital and emerging technologies. We are scaling up efforts to
              address digital harms, including online disinformation and polarization. And we promote sustainable
              solutions to power digital infrastructure at lower environmental cost.</p>
    gender:
      title: Gender Equality
      content: >
          <p>Realizing women’s rights and equal opportunities is integral to sustainable development and can accelerate results across the board. Complementing the work of UN-Women, UNDP designs its interventions for a deliberate impact on gender equality, seen by partners as one of its most effective areas of work. UNDP meets or exceeds 94% of the targets of the UN System-Wide Action Plan.</p>

          <p>Through its trusted relationships with governments, UNDP is well placed to help advance women’s empowerment across all dimensions of development.</p>

          <ul>
            <li>UNDP accelerates the leadership and equal participation of women in public institutions, elected positions, the judiciary and the private sector.</li>
            <li>UNDP works to enhance women’s economic opportunities through entrepreneurship, job creation and capacity-building, and to recognize, reduce and redistribute women’s unpaid care work.</li>
            <li>In crisis settings, UNDP reflects the interests and voice of women and girls.</li>
          </ul>

          <p>Demand is growing to help drive systemic change that overturns barriers limiting opportunities for women. We work with national governments, sharing successful approaches across countries and regions, and with local governments, which are closer to citizens and can turn national policies into real benefits for women and men.</p>
    finance:
      title: Sustainable Finance
      content: >
        <p>The development financing gap is not just a financial shortfall; it reflects the misalignment of capital flows with sustainable development priorities. Correcting this requires a shift from scaling development assistance to transforming development financing systems. The differentiating value of UNDP lies in:</p>

        <ul>
          <li>Bridging public and private finance systems</li>
          <li>Bringing together development and financial actors to align investment with sustainable development at country level</li>
        </ul>

        <p>UNDP works at the intersections of finance, governance, climate, nature and development to accelerate development and expand investment opportunities in emerging and developing economies.</p>

        <p>We work with countries to strengthen their regulatory, institutional and policy frameworks, making financial governance more stable and capital allocation more transparent. Integrated national financing frameworks in 86 countries have mobilized $16 billion in new finance and aligned over $32 billion with sustainable development.</p>

        <p>We work with development finance institutions and the private sector to scale financing instruments such as blended finance, green bonds, sustainability-linked loans and insurance-backed investments. We help governments mobilise domestic resources through progressive taxation, SDG-aligned budgeting and results-based fiscal policies.</p>

                  
  
  # ************************* Systems approach *************************


  delivering-value:
    
    heading: El enfoque sistémico
    list:
      item1: >
        Los Gobiernos y los asociados para el desarrollo buscan nuevas formas de hacer frente a los rápidos cambios, mediante la superación de los planteamientos sectoriales a corto plazo con el objetivo de transformar los sistemas sociales, económicos y financieros subyacentes.  
      item2: >
        El PNUD trabaja ya junto a los Gobiernos de 80 países para hacer frente a desafíos estructurales como la confianza social y la transformación urbana. A partir de este aprendizaje hemos elaborado una <span class="text-extrabold"><a target="blank" href="https://www.undp.org/systems-portfolio">política y unas prácticas de cartera</a> que fomentan la transformación del sistema</span>: reúnen a diversos asociados en un conjunto coordinado de intervenciones en aras de un objetivo común. Las carteras de Filipinas y Viet Nam, por ejemplo, replantean el modelo “producir-consumir-eliminar”, por lo que crean un medio ambiente más sano y abren posibilidades de nuevos medios de vida. 
      item3: >
        Dicho enfoque sistémico, crucial para la aplicación del Plan Estratégico, requiere colaboración, nuevas alianzas y financiación a largo plazo por parte de múltiples asociados. 

  # ************************* Comparative advantages *************************

  advantages:
    overline: Aportar valor
    heading: Cómo trabajamos
    intro: >
      El PNUD cuenta con una combinación única de capacidades y experiencia. 
      <br>
      Las evaluaciones, revisiones, asociados y observadores independientes consideran que nuestros puntos fuertes más distintivos son los siguientes:

    swiper:
      global-reach:
        title: "Alcance mundial, impacto local"
        body: "Los asociados valoran la combinación de alcance mundial y presencia local del PNUD en 170 países y territorios, especialmente en países pequeños y contextos complicados con un reducido número de organismos sobre el terreno."

      partnerships-catalyst:
        title: "Impulsor de alianzas"
        body: "El PNUD conecta a asociados de todo el sistema de las Naciones Unidas y de fuera de él, integrando los esfuerzos en todos los sectores y amplificando los resultados para el desarrollo."

      deep-expertise:
        title: "Amplios conocimientos técnicos"
        body: "Los conocimientos especializados acumulados durante decenios en materia de gobernanza, medio ambiente, crisis y pobreza se complementan con capacidades cada vez mayores en ámbitos más novedosos, como el cambio sistémico y las soluciones digitales integradas."

      integrated-solutions:
        title: "Soluciones integradas"
        body: "La capacidad del PNUD para “unir los puntos” entre sectores sustenta nuestro diseño de soluciones de desarrollo integradas y el apoyo a los marcos integrados de planificación y financiación de los propios Gobiernos."

      thought-leadership:
        title: "Liderazgo intelectual"
        body: 
          Nuestros productos de conocimiento, como el <i>Informe sobre Desarrollo Humano</i> y los índices de desarrollo multidimensional, se consideran activos fiables y rigurosos para los responsables de la formulación de políticas. 

      systems-advantage:
        title: "Ventaja de los sistemas"
        body: "Gracias a nuestras inversiones en datos, innovación y previsión digital y estratégica, el enfoque de cartera está ayudando al PNUD y sus asociados a dar sentido a los rápidos cambios. Las iniciativas de creación conjunta de carteras con organismos hermanos están empezando a redefinir el modo en que las Naciones Unidas pueden colaborar para lograr un cambio sistémico."

      anchor-in-crisis:
        title: "Un ancla en la que apoyarse en situaciones de crisis"
        body: "En situaciones de crisis, el PNUD permanece y cumple. Conecta a agentes de los ámbitos humanitario, del desarrollo y de la paz para sentar las bases de un desarrollo a largo plazo desde el primer día."

      policy-operational:
        title: "Políticas y operaciones"
        body: "La combinación de experiencia en materia de políticas y operaciones se traduce en mejores resultados de desarrollo. Por ejemplo, los conocimientos especializados del PNUD en adquisiciones y gobernanza le permiten apoyar la gestión electoral de los países con total fluidez, desde la política hasta la planificación y la ejecución."

      value-at-scale:
        title: "Valor a gran escala"
        body: "Al prestar servicios compartidos de finanzas, recursos humanos, tecnología de la información y adquisiciones a más de 70 entidades de las Naciones Unidas, el PNUD crea economías de escala destinadas a todo el sistema de las Naciones Unidas para el desarrollo."


  # ************************* Future-smart *************************

  future-smart:
    heading: Operaciones inteligentes preparadas para el futuro 	
    copy: >
      Durante los últimos ocho años, el PNUD ha modernizado sus operaciones de modo que en la actualidad llegan a los programas y servicios 92 centavos de cada dólar invertido. El PNUD sigue aumentando su eficiencia y su eficacia mediante la creación de una organización más ágil, más rápida y con mayor capacidad de respuesta.	
    
    cta:
      label: Leer más
      link: futuresmart-operations

  # ************************* Partnerships *************************

  partnerships:
    heading: Alianzas para el progreso
    copy: >
      El PNUD conecta a asociados de todo el sistema de las Naciones Unidas y de fuera de él, integrando los esfuerzos en todos los sectores y amplificando los resultados para el desarrollo. Los asociados valoran al PNUD por su poder facilitador y de convocatoria, como intermediario honesto que crea consenso entre las partes interesadas y como impulsor de alianzas público-privadas.
    cta:
      label: Leer más
      link: partnerships


  # ************************* Looking ahead *************************

  looking-ahead:
    heading: Perspectivas para el futuro
    intro: >
      Debido a los cambios geopolíticos, la volatilidad económica y las ideas surgidas de la Iniciativa ONU80, la cooperación para el desarrollo se enfrenta a numerosos futuros posibles. El Plan Estratégico, una base sólida para que el PNUD siga siendo fiable y logrando resultados en un mundo que cambia con rapidez, está:
    icons:
      complexity:
        heading: Diseñado para hacer frente a la complejidad
        text: 
          Dado que supone que las perturbaciones continuarán, el enfoque sistémico y las capacidades de previsión estratégica equipan al PNUD para desenvolverse en esa complejidad.
      demand:
        heading: Basado en la demanda
        text: Se basa en las necesidades actuales y futuras de nuestros asociados, con flexibilidad para cambiar según su evolución. 
      adaptive:
        heading: Preparado para adaptarse
        text: Facilita que el PNUD responda de forma pragmática a diferentes escenarios, incluidas las fluctuaciones en la financiación. El plan permite la expansión o la consolidación de elementos programáticos a medida que surjan oportunidades o limitaciones, manteniendo al mismo tiempo la integridad de la oferta del PNUD. 
    copy: >
      El PNUD ofrece la plataforma necesaria para realizar inversiones conjuntas en acciones que promuevan la prosperidad mundial mientras protegen el planeta. El éxito del plan, un <span class="text-extrabold">esfuerzo conjunto entre el PNUD y los Estados miembros</span>, dependerá de la determinación y la colaboración compartidas.

