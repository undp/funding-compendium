popups: 
  prosperity:
    heading: Prospérité pour tous
    copy:
      para1: L'extrême pauvreté est aujourd'hui encore un fléau quotidien pour 9 % de la population mondiale. 
      para2: >
        Le PNUD vise à assurer la prospérité de tous, tout en préservant sa forte empreinte dans la promotion de la lutte contre la pauvreté et les inégalités, et son engagement à ne laisser personne de côté. Ce changement s'aligne sur l'évolution des aspirations de nos partenaires : dépasser l'objectif d'un seuil minimum de pauvreté en vue de construire des économies et des sociétés dynamiques et résilientes où chacun peut s'épanouir. 
      overline-icons: Le PNUD aide à réduire la pauvreté et à créer la prospérité en
      icon1: élargissant les possibilités offertes aux personnes et aux entreprises d'accéder à des ressources productives, à des emplois décents et à des moyens de subsistance, ainsi qu’en renforçant le capital humain
      icon2:  améliorant la protection contre les chocs, les crises et la vulnérabilité multidimensionnelle, à travers la réduction des risques, l'accès aux services essentiels et à la protection sociale
      para3: La prospérité pour tous doit inclure l'amélioration des opportunités économiques pour les femmes et l’élimination des obstacles qui entravent leur pleine participation économique, notamment l'accès aux droits de propriété, aux services financiers et à l'égalité salariale. 
      para4: Les pays suivent des voies de développement différentes, c'est pourquoi le PNUD adapte son travail aux différents contextes nationaux et groupes de population. La progression sur la voie de la prospérité est mesurée à l'aide d'indicateurs multidimensionnels qui évaluent à la fois les opportunités économiques et les capacités accrues des personnes, notamment des indices de développement humain corrigés des inégalités et des différences entre les hommes et les femmes. 


  governance:
    heading: Gouvernance efficace

    copy:
      para1: Une gouvernance responsable, inclusive et efficace est essentielle au développement humain. Le PNUD travaille au développement d’une gouvernance responsable, centrée sur les personnes et fondée sur les droits, conformément aux principes intergouvernementaux d'une gouvernance efficace pour le développement durable. 
      para2: >
        La capacité du PNUD à intégrer la gouvernance dans toutes ses activités, en tant que dimension essentielle du changement systémique, lui confère une longueur d'avance pour relever les défis interdépendants du développement durable.
      para3: S'appuyant sur la pensée systémique, l'innovation et la prospective stratégique, le PNUD aide les pays à développer une gouvernance et des politiques plus agiles et anticipatives, ainsi qu’à fournir des services adaptés et créer des opportunités économiques - dont des infrastructures publiques numériques et un accès accru aux services grâce à la numérisation et à l'IA.
      para4: La gouvernance démocratique, les droits de l'homme et l'état de droit sont fondamentaux pour le développement de sociétés et d’économies prospères, mais aussi pour soutenir la paix et la sécurité des populations. On observe une demande croissante auprès du PNUD pour que celui-ci soutienne les dialogues politiques et les processus électoraux, y compris dans les contextes de transition et de crise. Les partenariats avec les gouvernements nationaux et locaux, les parlements et la société civile aident à bâtir une sphère publique ouverte, où chacun peut participer.
      para5: Dans les situations de conflit et de violence, le PNUD promeut la cohésion sociale et renforce la sécurité des communautés et la consolidation de la paix au niveau local, par le dialogue, la médiation interne et la mise en œuvre d’approches locales.

  crisis:
    heading: Résilience face aux crises
    copy:
      para1: Bien que les crises soient toutes très différentes, la menace qu'elles représentent pour le développement humain et la sécurité des populations est importante et croissante. Le PNUD s'attache dès les premiers jours d'une crise à protéger les acquis du développement et à réduire les risques, en posant les bases d'un redressement et d'une éventuelle sortie de la dépendance à l'égard de l'assistance humanitaire.
      para2: >
        Le PNUD fait office de « bâtisseur de ponts » entre les systèmes d'aide humanitaire, de développement et de consolidation de la paix, en soutenant les équipes nationales des Nations unies et les équipes humanitaires, dirigées par des coordonnateurs résidents et des coordonnateurs humanitaires, à maintenir une continuité entre les phases de réponse et à poursuivre le développement à long terme.
      para3: Le PNUD joue un rôle clé dans la stabilisation et le redressement à un stade précoce, notamment en élargissant les perspectives économiques des femmes et en donnant à ces dernières plus de poids dans la prise de décision. Le PNUD soutient également la participation des jeunes à la gouvernance démocratique et fait entendre sa voix dans les processus de paix.
      para4: L'engagement du PNUD à « rester et agir » dans les environnements les plus difficiles permet un soutien cohérent à tous les stades de la crise. De solides capacités opérationnelles et une présence mondiale nous permettent de fournir des services à grande échelle, y compris dans les zones reculées et à haut risque. Des relations de longue date et des réseaux locaux nous permettent d'opérer dans des situations de crise ou des contextes politiques complexes où d'autres ne peuvent pas opérer.
  
  planet:
    heading: Planète saine
    copy:
      para1: Le développement durable est impossible sans une planète en bonne santé.
      para2: >
        Le PNUD agit comme un interlocuteur de premier plan à la croisée de la planète et du développement, en proposant des solutions intégrées aux défis du changement climatique, des catastrophes, de la perte de biodiversité, de l'énergie, des produits chimiques et des déchets, tout en faisant progresser les priorités de développement en matière de gouvernance, de prospérité et de résilience. 
      para3: Le PNUD vise à traduire les engagements mondiaux - relevant de l'Accord de Paris, du Cadre mondial pour la biodiversité de Kunming-Montréal, du Protocole de Montréal et d'autres accords internationaux - en action locale efficace. Nous aidons les pays à évaluer leurs options pour réaliser des transitions justes et durables; et à exploiter de nouvelles idées pour relever les défis qui se posent à eux en matière de financement. 
      overline-icons: >
        Le PNUD travaille avec :
      icon1: les pays, pour améliorer la cohérence des politiques associées à leurs engagements nationaux et mettre en œuvre ces engagements de sorte à répondre au contexte local
      icon2:  les gouvernements, la société civile, les institutions financières et le secteur privé, pour co-investir dans des actions qui promeuvent la prospérité tout en protégeant la planète
      para4: À travers l’initiative Climate Promise 2025, le PNUD a créé une plateforme permettant de mobiliser le système des Nations unies pour soutenir les objectifs et les stratégies des pays en matière climatique.


  digital:
    heading: Transformation du numérique et de l’IA
    copy:
      para1: >
         Les progrès numériques rapides et l'essor de l'IA transforment à la fois les économies, la gouvernance et les sociétés. Ces opportunités sont toutefois assorties de risques : menaces pour la cybersécurité, la confidentialité des données, la partialité des algorithmes et l'impact croissant des technologies numériques sur l'environnement. Une personne sur trois dans le monde ne dispose toujours pas d’un accès à Internet. Il est donc urgent pour le PNUD de soutenir les pays qui œuvrent pour une connectivité efficace dans un avenir numérique ouvert, libre et sécurisé. 
      para2: >
       Les vastes compétences du PNUD et son approche axée sur les pays lui permettent de soutenir une transformation numérique holistique de manière intégrée et systémique. 
      para3: >
        Le PNUD a travaillé avec plus de 120 pays afin de mettre les technologies numériques au service de leur développement. Il s'agit notamment d'aider les institutions et les personnes à développer leurs capacités d'accès et d'utilisation de la technologie et des données numériques, ainsi que d'aider les pays à mettre en place une infrastructure publique numérique robuste, notamment des systèmes de paiement numérique et d'identification numérique sécurisée.
      para4: >
        Ensemble avec nos partenaires, nous travaillons sur des politiques, des réglementations et des plans de développement qui garantissent une utilisation sûre, sécurisée et responsable des technologies numériques et émergentes. Nous intensifions nos efforts pour lutter contre les méfaits du numérique, notamment la désinformation et la polarisation en ligne. Enfin, nous promouvons des solutions durables pour alimenter l'infrastructure numérique à moindre coût environnemental.

  gender:
    heading: Égalité entre les hommes et les femmes
    copy:
      para1:  >
        La reconnaissance des droits des femmes et l'égalité des chances font partie intégrante du développement durable et peuvent accélérer les résultats dans tous les domaines. Venant compléter le travail de l'ONU-Femmes, le PNUD conçoit ses interventions de sorte qu'elles aient un impact concret sur l'égalité des sexes, ce que ses partenaires considèrent comme l'un de ses domaines d'activité les plus efficaces. Le PNUD atteint ou surpasse 94 % des objectifs du plan d'action de l'ensemble du système des Nations unies.
      para2: >
        Grâce à ses relations de confiance avec les gouvernements, le PNUD est idéalement placé pour faire progresser l'autonomisation des femmes dans toutes les dimensions du développement. 
     
      icon1: Le PNUD promeut en outre le leadership et la participation égale des femmes dans les institutions publiques, les postes électifs, le système judiciaire et le secteur privé. 
      icon2: Le PNUD s'efforce d'améliorer les opportunités économiques des femmes à travers l'entreprenariat, la création d'emplois et le renforcement des capacités, ainsi que de reconnaître, de réduire et de redistribuer le travail de soutien non rémunéré des femmes. 
      icon3: Dans les situations de crise, le PNUD reflète les intérêts et la voix des femmes et des jeunes filles. 
     
      para3: >
        La demande de changement systémique visant à éliminer les obstacles qui limitent les possibilités offertes aux femmes est de plus en plus forte. Pour ce faire, nous travaillons avec les gouvernements nationaux, en partageant les approches réussies entre les pays et les régions, ainsi qu’avec les gouvernements locaux, qui sont plus proches des citoyens et peuvent donc transformer les politiques nationales en avantages réels pour les femmes et les hommes. 

  finance:
    heading: Financement durable
    copy:
      para1:  >
        Le manque de financement qui affecte le développement ne se limite pas à une insuffisance budgétaire ; il reflète le décalage entre les flux de capitaux et les priorités en matière de développement durable. Afin d'y remédier, il est indispensable de passer des efforts d'accroissement de l’aide à une transformation des systèmes de financement du développement. La valeur différentielle du PNUD réside dans :
      icon1: le rapprochement des systèmes de financement public et privé
      icon2: le rapprochement des acteurs du développement et de la finance pour aligner l'investissement sur le développement durable au niveau national
      para2: >
        Le PNUD travaille à l'intersection de la finance, de la gouvernance, du climat, de la nature et du développement pour accélérer le progrès et élargir les opportunités d'investissement dans les économies émergentes et en développement.
      para3: >
        Nous travaillons avec les pays au renforcement de leurs cadres réglementaires, institutionnels et politiques, afin de rendre la gouvernance financière plus stable et l'allocation des capitaux plus transparente. Les cadres de financement nationaux intégrés dans 86 pays ont permis de mobiliser 16 milliards de dollars de nouveaux financements et d'aligner plus de 32 milliards de dollars sur le développement durable. 
      para4: >
        Nous travaillons avec les institutions de financement du développement et le secteur privé pour développer des instruments financiers tels que des financements mixtes, des obligations vertes, des prêts liés à la durabilité et des investissements garantis par des assurances. Nous aidons les gouvernements à mobiliser des ressources nationales par le biais d'une fiscalité progressive, d'une budgétisation alignée sur les ODD et de politiques budgétaires axées sur les résultats.


